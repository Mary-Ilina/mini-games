<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini Games</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #14161a;
    --card-bg: #1e2128;
    --accent: #5ee6a0;
    --text: #eef1f5;
    --muted: #9aa2ad;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 2rem 1.25rem 4rem;
  }
  header {
    max-width: 900px;
    margin: 0 auto 2.5rem;
    text-align: center;
  }
  h1 {
    font-size: 2.25rem;
    margin-bottom: 0.5rem;
  }
  header p {
    color: var(--muted);
    margin: 0;
  }
  .grid {
    max-width: 900px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 1.25rem;
  }
  .card {
    display: block;
    background: var(--card-bg);
    border: 1px solid #2a2e37;
    border-radius: 12px;
    padding: 1.5rem;
    text-decoration: none;
    color: var(--text);
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .card:hover {
    transform: translateY(-3px);
    border-color: var(--accent);
  }
  .card .emoji {
    font-size: 2.5rem;
    display: block;
    margin-bottom: 0.75rem;
  }
  .card h2 {
    margin: 0 0 0.35rem;
    font-size: 1.25rem;
  }
  .card p {
    margin: 0;
    color: var(--muted);
    font-size: 0.9rem;
  }
</style>
</head>
<body>
  <header>
    <h1>Mini Games</h1>
    <p>A small collection of dependency-free browser games.</p>
  </header>
  <main class="grid">
    <a class="card" href="games/snake/index.html">
      <span class="emoji">🐍</span>
      <h2>Snake</h2>
      <p>Classic grid snake. Arrow keys or WASD.</p>
    </a>
    <a class="card" href="games/snake-3d/index.html">
      <span class="emoji">🧊</span>
      <h2>Snake 3D</h2>
      <p>Snake in a rendered 3D cube. Arrow keys + W/S, drag to orbit.</p>
    </a>
  </main>
</body>
</html>
