<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake — Mini Games</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #14161a;
    --board-bg: #1e2128;
    --grid-line: #262a32;
    --snake: #5ee6a0;
    --snake-head: #8ef5c0;
    --food: #ff6b6b;
    --heart: #ff9ecf;
    --obstacle: #4a5262;
    --text: #eef1f5;
    --muted: #9aa2ad;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 1.5rem 1rem 3rem;
  }
  .top-bar {
    width: 100%;
    max-width: 480px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
  }
  a.back {
    color: var(--muted);
    text-decoration: none;
    font-size: 0.9rem;
  }
  a.back:hover { color: var(--text); }
  h1 {
    font-size: 1.5rem;
    margin: 0 0 1rem;
  }
  .hud {
    width: 100%;
    max-width: 480px;
    display: flex;
    justify-content: space-between;
    margin-bottom: 0.75rem;
    font-size: 1.1rem;
    flex-wrap: wrap;
    gap: 0.4rem;
  }
  .hud .label { color: var(--muted); font-size: 0.85rem; margin-right: 0.35rem; }
  #lives .heart-icon { color: var(--heart); }
  #board-wrap {
    position: relative;
    line-height: 0;
  }
  canvas {
    background: var(--board-bg);
    border: 2px solid var(--grid-line);
    border-radius: 8px;
    display: block;
  }
  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(20, 22, 26, 0.88);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    text-align: center;
    padding: 1rem;
  }
  #overlay.show { display: flex; }
  #overlay h2 {
    margin: 0 0 0.5rem;
    font-size: 1.5rem;
  }
  #overlay p {
    margin: 0 0 1.25rem;
    color: var(--muted);
  }
  button#restart {
    background: var(--snake);
    color: #10131a;
    border: none;
    border-radius: 8px;
    padding: 0.6rem 1.4rem;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  button#restart:hover { filter: brightness(1.08); }
  .hint {
    margin-top: 1rem;
    color: var(--muted);
    font-size: 0.85rem;
    text-align: center;
    max-width: 480px;
  }
</style>
</head>
<body>
  <div class="top-bar">
    <a class="back" href="../../index.html">&larr; All games</a>
  </div>
  <h1>Snake</h1>
  <div class="hud">
    <div><span class="label">Score</span><span id="score">0</span></div>
    <div><span class="label">Level</span><span id="level">1</span></div>
    <div id="lives"><span class="label">Lives</span><span id="lives-value"></span></div>
    <div><span class="label">Speed</span><span id="speed">1</span></div>
    <div><span class="label">Best</span><span id="best">0</span></div>
  </div>
  <div id="board-wrap">
    <canvas id="board" width="400" height="400"></canvas>
    <div id="overlay">
      <h2 id="overlay-title">Game Over</h2>
      <p id="overlay-msg">Final score: 0</p>
      <button id="restart">Play again</button>
    </div>
  </div>
  <p class="hint">Arrow keys or WASD to move. Space to restart after game over. Clear obstacles courses and collect the pink heart to regain a life.</p>

<script>
(function () {
  const CELL = 20;
  const COLS = 20;
  const ROWS = 20;
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const levelEl = document.getElementById('level');
  const livesEl = document.getElementById('lives-value');
  const speedEl = document.getElementById('speed');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlay-title');
  const overlayMsg = document.getElementById('overlay-msg');
  const restartBtn = document.getElementById('restart');

  const BEST_KEY = 'mini-games-snake-best';
  let best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10);
  bestEl.textContent = best;

  const START_SNAKE = [
    { x: 9, y: 10 },
    { x: 8, y: 10 },
    { x: 7, y: 10 },
  ];
  const START_DIR = { x: 1, y: 0 };
  const MAX_LIVES = 3;
  const FRUIT_TARGET = 5; // normal fruit needed to clear a level
  const LEVEL_COUNT = 3;
  const BASE_TICK_MS = 330;
  const LAP_SPEEDUP_MS = 35; // each lap through levels 1-3 gets faster
  const MIN_TICK_MS = 60;
  const LIFE_FRUIT_CHANCE = 0.015; // per tick chance to spawn if eligible
  const OBSTACLE_COUNTS = [0, 18, 32]; // per level, index = level-1

  let snake, dir, nextDir, food, lifeFood, score, lives, alive, tickHandle;
  let level, lap, fruitEaten, obstacles, tickMs, pendingRespawn;

  function randCell() {
    return { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
  }

  function cellKey(c) { return c.x + ',' + c.y; }

  // BFS reachability check: every non-obstacle cell must be reachable from the
  // snake's starting cell, so no obstacle layout can seal off part of the grid.
  function isLayoutReachable(obstacleSet) {
    const startCell = START_SNAKE[0];
    if (obstacleSet.has(cellKey(startCell))) return false;
    const visited = new Set([cellKey(startCell)]);
    const queue = [startCell];
    while (queue.length) {
      const cur = queue.shift();
      const neighbors = [
        { x: cur.x + 1, y: cur.y }, { x: cur.x - 1, y: cur.y },
        { x: cur.x, y: cur.y + 1 }, { x: cur.x, y: cur.y - 1 },
      ];
      for (const n of neighbors) {
        if (n.x < 0 || n.x >= COLS || n.y < 0 || n.y >= ROWS) continue;
        const k = cellKey(n);
        if (visited.has(k) || obstacleSet.has(k)) continue;
        visited.add(k);
        queue.push(n);
      }
    }
    let totalOpen = 0;
    for (let x = 0; x < COLS; x++) {
      for (let y = 0; y < ROWS; y++) {
        if (!obstacleSet.has(x + ',' + y)) totalOpen++;
      }
    }
    return visited.size === totalOpen;
  }

  function generateObstacles(count) {
    if (count <= 0) return [];
    const startOccupied = new Set(START_SNAKE.map(cellKey));
    let attempt = 0;
    while (attempt < 200) {
      attempt++;
      const set = new Set();
      const list = [];
      let guard = 0;
      while (list.length < count && guard < count * 40) {
        guard++;
        const c = randCell();
        const k = cellKey(c);
        if (startOccupied.has(k) || set.has(k)) continue;
        set.add(k);
        list.push(c);
      }
      if (isLayoutReachable(set)) return list;
    }
    // Fallback: no obstacles rather than risk an unsolvable layout.
    return [];
  }

  function buildLevel(lvl) {
    obstacles = generateObstacles(OBSTACLE_COUNTS[lvl - 1] || 0);
  }

  function occupiedByObstacle(cell) {
    return obstacles.some(o => o.x === cell.x && o.y === cell.y);
  }

  function spawnFood() {
    let cell;
    do {
      cell = randCell();
    } while (
      snake.some(s => s.x === cell.x && s.y === cell.y) ||
      occupiedByObstacle(cell) ||
      (lifeFood && lifeFood.x === cell.x && lifeFood.y === cell.y)
    );
    food = cell;
  }

  function maybeSpawnLifeFood() {
    if (lifeFood) return;
    if (lives >= MAX_LIVES) return;
    if (Math.random() > LIFE_FRUIT_CHANCE) return;
    let cell;
    let guard = 0;
    do {
      cell = randCell();
      guard++;
    } while (
      guard < 200 && (
        snake.some(s => s.x === cell.x && s.y === cell.y) ||
        occupiedByObstacle(cell) ||
        (food && food.x === cell.x && food.y === cell.y)
      )
    );
    if (guard < 200) lifeFood = cell;
  }

  function updateHud() {
    scoreEl.textContent = score;
    levelEl.textContent = level;
    livesEl.textContent = '♥'.repeat(Math.max(lives, 0)) + '♡'.repeat(Math.max(MAX_LIVES - lives, 0));
    speedEl.textContent = lap + 1;
  }

  function startRun() {
    level = 1;
    lap = 0;
    lives = MAX_LIVES;
    score = 0;
    tickMs = BASE_TICK_MS;
    buildLevel(level);
    placeSnakeAtStart();
    alive = true;
    overlay.classList.remove('show');
    updateHud();
    if (tickHandle) clearInterval(tickHandle);
    tickHandle = setInterval(tick, tickMs);
    draw();
  }

  function placeSnakeAtStart() {
    snake = START_SNAKE.map(c => ({ x: c.x, y: c.y }));
    dir = { x: START_DIR.x, y: START_DIR.y };
    nextDir = dir;
    fruitEaten = 0;
    lifeFood = null;
    spawnFood();
  }

  function restartTicker() {
    clearInterval(tickHandle);
    tickHandle = setInterval(tick, tickMs);
  }

  function loseLife() {
    lives -= 1;
    updateHud();
    if (lives <= 0) {
      endGame();
      return;
    }
    placeSnakeAtStart();
    draw();
  }

  function endGame() {
    alive = false;
    clearInterval(tickHandle);
    if (score > best) {
      best = score;
      localStorage.setItem(BEST_KEY, String(best));
      bestEl.textContent = best;
    }
    overlayTitle.textContent = 'Game Over';
    overlayMsg.textContent = 'Final score: ' + score + ' — reached level ' + level + ' (lap ' + (lap + 1) + ')';
    overlay.classList.add('show');
  }

  function advanceLevel() {
    if (level < LEVEL_COUNT) {
      level += 1;
    } else {
      // Completed a lap through all levels: loop back to level 1, faster.
      level = 1;
      lap += 1;
      tickMs = Math.max(MIN_TICK_MS, BASE_TICK_MS - lap * LAP_SPEEDUP_MS);
      restartTicker();
    }
    buildLevel(level);
    placeSnakeAtStart();
    updateHud();
  }

  function tick() {
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
      loseLife();
      return;
    }
    if (occupiedByObstacle(head)) {
      loseLife();
      return;
    }
    if (snake.some(s => s.x === head.x && s.y === head.y)) {
      loseLife();
      return;
    }

    snake.unshift(head);

    let grew = false;
    if (head.x === food.x && head.y === food.y) {
      score += 1;
      fruitEaten += 1;
      grew = true;
      if (fruitEaten >= FRUIT_TARGET) {
        advanceLevel();
        draw();
        return;
      }
      spawnFood();
    } else if (lifeFood && head.x === lifeFood.x && head.y === lifeFood.y) {
      lives = Math.min(MAX_LIVES, lives + 1);
      lifeFood = null;
      grew = true;
      updateHud();
    }

    if (!grew) {
      snake.pop();
    }

    maybeSpawnLifeFood();
    draw();
  }

  function draw() {
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--board-bg') || '#1e2128';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = '#262a32';
    ctx.lineWidth = 1;
    for (let i = 1; i < COLS; i++) {
      ctx.beginPath();
      ctx.moveTo(i * CELL, 0);
      ctx.lineTo(i * CELL, canvas.height);
      ctx.stroke();
    }
    for (let i = 1; i < ROWS; i++) {
      ctx.beginPath();
      ctx.moveTo(0, i * CELL);
      ctx.lineTo(canvas.width, i * CELL);
      ctx.stroke();
    }

    ctx.fillStyle = '#4a5262';
    obstacles.forEach(o => {
      roundRect(o.x * CELL + 2, o.y * CELL + 2, CELL - 4, CELL - 4, 3);
      ctx.fill();
    });

    ctx.fillStyle = '#ff6b6b';
    roundRect(food.x * CELL + 2, food.y * CELL + 2, CELL - 4, CELL - 4, 4);
    ctx.fill();

    if (lifeFood) {
      drawHeart(lifeFood.x * CELL + CELL / 2, lifeFood.y * CELL + CELL / 2, CELL * 0.4);
    }

    snake.forEach((seg, i) => {
      ctx.fillStyle = i === 0 ? '#8ef5c0' : '#5ee6a0';
      roundRect(seg.x * CELL + 1, seg.y * CELL + 1, CELL - 2, CELL - 2, 4);
      ctx.fill();
    });
  }

  function drawHeart(cx, cy, size) {
    ctx.fillStyle = '#ff9ecf';
    ctx.beginPath();
    const topCurveHeight = size * 0.3;
    ctx.moveTo(cx, cy + size * 0.35);
    ctx.bezierCurveTo(cx, cy, cx - size / 2, cy, cx - size / 2, cy + topCurveHeight);
    ctx.bezierCurveTo(cx - size / 2, cy + (size + topCurveHeight) / 2, cx, cy + (size + topCurveHeight) / 1.4, cx, cy + size);
    ctx.bezierCurveTo(cx, cy + (size + topCurveHeight) / 1.4, cx + size / 2, cy + (size + topCurveHeight) / 2, cx + size / 2, cy + topCurveHeight);
    ctx.bezierCurveTo(cx + size / 2, cy, cx, cy, cx, cy + size * 0.35);
    ctx.closePath();
    ctx.fill();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  const KEY_MAP = {
    ArrowUp: { x: 0, y: -1 }, ArrowDown: { x: 0, y: 1 },
    ArrowLeft: { x: -1, y: 0 }, ArrowRight: { x: 1, y: 0 },
    w: { x: 0, y: -1 }, s: { x: 0, y: 1 },
    a: { x: -1, y: 0 }, d: { x: 1, y: 0 },
    W: { x: 0, y: -1 }, S: { x: 0, y: 1 },
    A: { x: -1, y: 0 }, D: { x: 1, y: 0 },
  };

  window.addEventListener('keydown', (e) => {
    if (!alive) {
      if (e.key === ' ' || e.code === 'Space') {
        e.preventDefault();
        startRun();
      }
      return;
    }
    const wanted = KEY_MAP[e.key];
    if (!wanted) return;
    e.preventDefault();
    if (wanted.x === -dir.x && wanted.y === -dir.y) return;
    nextDir = wanted;
  });

  restartBtn.addEventListener('click', startRun);

  startRun();
})();
</script>
</body>
</html>
